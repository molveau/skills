name: release

# Publishes to npm when main carries a version that npm does not have yet. The publish job runs in the
# `npm` environment, which waits for the owner's approval (GitHub app or website). npm trusts this
# workflow through trusted publishing (OIDC): no npm token is stored in the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      unpublished: ${{ steps.version.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@molveau/skills@$version" version --silent >/dev/null 2>&1; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
            echo "$version is already on npm, nothing to publish."
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
            echo "$version is not on npm yet, waiting for approval."
          fi

  publish:
    needs: check
    if: needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Molveau skills $VERSION" --notes-file notes.md
